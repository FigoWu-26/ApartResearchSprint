[project]
name = "llm-agent-collusion-2"
version = "0.1.0"
description = "Voluntary secret-tool collusion in competing LLM agents (Liar's Bar and Cleanup games)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "poseidon-compute",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "requests>=2.25.0",
    "pytest>=7.0.0",
    "seaborn>=0.11.0",
    "pandas>=1.3.0",
]

[tool.uv]
package = false

[tool.uv.sources]
poseidon-compute = { path = "../util", editable = true }
