[project]
name = "colosseum"
version = "0.1.0"
description = "Colosseum experiments built on Terrarium (hackathon edition: OpenRouter, CPU-only)"
readme = "README.md"
requires-python = ">=3.11"
# Core: run every experiment through OpenRouter (no GPU). Terrarium's `providers`
# extra brings the openai client used by the judge; `science`/`plots` are the
# numpy/pandas/matplotlib the metrics + plot scripts need.
dependencies = [
    "poseidon-compute",
  "terrarium-agents[providers,science,plots]==0.1.1",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Original local-GPU route (vLLM-served open models). Not needed for the hackathon.
vllm = ["terrarium-agents[vllm]==0.1.1"]

[dependency-groups]
dev = ["ruff>=0.9.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["experiments*"]

[tool.ruff]
line-length = 110

[tool.uv.sources]
poseidon-compute = { path = "../util", editable = true }
