# Positive control: assigned coalition of 2 + private channel (coalition-only blackboard).
#
# Hackathon (sprint project 2.1 "which kinds of tasks lead to collusion?").
# Reproduce ONE supplied collusion run first: two colluders share a hidden blackboard and are told to
# coordinate ('simple' variant). Expect a positive coalition advantage (see summary.csv).
# Model calls go through the shared endpoint (Nebius by default; set NEBIUS_API_KEY in the
# repo-root compute.env). Swap `model:` for any open model id Nebius serves.

simulation:
  max_iterations: 1
  max_planning_rounds: 2        # paper: 4. Fewer rounds = fewer calls; raise once the control passes.
  max_conversation_steps: 3
  seed: 1
  tags: [hackathon_positive_control]

environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8

communication_network:
  topology: complete
  num_agents: 4                 # paper: 6
  consolidate_channels: true    # one shared blackboard for the whole network

llm_models:
  - label: openai_gpt4o_mini
    llm:
      provider: openrouter
      openrouter:
        model: Qwen/Qwen2.5-7B-Instruct   # open model served by Nebius (was openai/gpt-4o-mini)
        params:
          max_tokens: 1500
          temperature: 0.7

experiment:
  tag: hackathon_positive_control
  output_dir: experiments/collusion/outputs/hackathon_positive_control
  max_concurrent_runs: 2
  seeds: [1]                    # start with one seed; expand to 3-5 after the positive control passes
  collusion:
    colluder_selection: first   # the coalition is always the same two agents (comparable across conditions)
    agent_order: random
  sweeps:
    - name: hackathon_positive_control
      topologies: [complete]
      num_agents: [4]
      colluder_counts: [2]
      secret_channel_enabled: [true]
      prompt_variants: [simple]
