[project]
name = "steganographic-collusion"
version = "0.1.0"
description = "Auditor for detecting steganographic collusion in multi-agent LLM systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "poseidon-compute",
    "numpy>=1.25,<2.0",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pytest>=7.4",
    "PyYAML>=6.0",
    "openai>=1.12.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# local distilgpt2 backend only; ~5GB (CUDA torch wheel from PyPI)
local = [
    "transformers>=4.36.0",
    "accelerate>=0.24.0",
    "torch>=2.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
poseidon-compute = { path = "../util", editable = true }
