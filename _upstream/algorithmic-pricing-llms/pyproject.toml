[project]
name = "algorithmic-pricing-llms"
version = "0.2.0"
description = "LLM agents in repeated pricing games (Calvano 2020 demand). Hackathon edition."
readme = "README.md"
requires-python = ">=3.11"
# Core: run every experiment script against a hosted or local LLM provider
# and produce the plots. CPU-only, installs in well under a minute.
dependencies = [
    "poseidon-compute",
    "numpy>=2.0",
    "scipy>=1.13",
    "polars>=1.30.0",
    "pyarrow>=20.0.0",
    "pydantic>=2.11",
    "python-dotenv>=1.0",
    "matplotlib>=3.10",
    "mistralai>=1.8.2",
    "openai>=1.86.0",
]

[project.optional-dependencies]
# Statistical notebooks (regression.ipynb, results_*_FE.ipynb, welch_tests.ipynb, plots.ipynb)
analysis = [
    "jupyter>=1.1.1",
    "ipykernel>=6.29.5",
    "pandas>=2.3.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
    "linearmodels>=6.1",
    "lifelines>=0.29",
    "scikit-learn>=1.7.0",
]
# Text-analysis notebooks (text_analysis_*.ipynb): pulls in torch, ~2 GB
text = [
    "sentence-transformers>=5.0.0",
    "hdbscan>=0.8.40",
    "nltk>=3.9.1",
    "syntok>=1.4.4",
    "wordcloud>=1.9.4",
]
dev = ["ruff>=0.11.13", "pre-commit>=4.2.0"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.uv.sources]
poseidon-compute = { path = "../util", editable = true }
