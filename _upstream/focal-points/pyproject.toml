[project]
name = "focal-points"
version = "0.1.0"
description = "Focal points, coordination and bargaining experiments with LLMs. Hackathon edition (OpenRouter, no GPU)."
readme = "README.md"
requires-python = ">=3.10"
# Core: run main.py through OpenRouter, compute coordination indices, make the plots,
# run the bargaining-table analysis. CPU only.
dependencies = [
    "poseidon-compute",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "openai>=1.86.0",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Original local-inference path (src/utils/llm.py LocalLLM): needs a CUDA GPU
gpu = ["torch", "transformers>=4.57", "accelerate", "bitsandbytes", "huggingface-hub"]
# Original direct-API / batch-job scripts (src/batch_requests, src/SAR)
providers = ["google-genai>=1.0"]
dev = ["ruff", "jupyter"]

[tool.setuptools]
packages = ["src", "src.utils", "src.plotting", "src.bargaining_table", "src.batch_requests", "src.SAR", "src.build_sar_maps"]

[tool.ruff]
line-length = 110

[tool.uv.sources]
poseidon-compute = { path = "../util", editable = true }
