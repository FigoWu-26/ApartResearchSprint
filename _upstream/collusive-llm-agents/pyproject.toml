[project]
name = "collusive-llm-agents"
version = "0.1.0"
description = "LLM pricing agents reaching collusive market-division outcomes in Bertrand and Cournot oligopoly games (arXiv:2410.00031)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "poseidon-compute",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "pytz",
    "arch",
    "jupyter",
    "ipykernel",
]

[tool.uv]
package = false

[tool.uv.sources]
poseidon-compute = { path = "../util", editable = true }
