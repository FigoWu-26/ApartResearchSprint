[project]
name = "llm-cartel"
version = "0.1.0"
description = "LLM collusion experiments for the Bertrand pricing game (ICML 2026). Hackathon edition."
readme = "README.md"
requires-python = ">=3.10"
# Core: the API-based harness (run_game.py, branch_game.py, judges/api_judge.py) - CPU only.
dependencies = [
    "poseidon-compute",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "openai>=1.86.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Original GPU experiments: r1_*_tester.py, steering/, partial_steering/, judges/*_warden_*.py
gpu = ["vllm", "torch", "transformers"]
# Steering-vector training + analysis plots
steering = ["matplotlib", "seaborn", "scikit-learn", "tqdm"]
dev = ["ruff"]

[tool.setuptools]
packages = ["environment", "harness"]

[tool.ruff]
line-length = 110

[tool.uv.sources]
poseidon-compute = { path = "../util", editable = true }
